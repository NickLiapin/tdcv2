name: TypeScript CI

on:
  push:
    branches: [tdcv2]
    paths:
      - "typescript/**"
      - "webdoc/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typescript-ci.yml"
  pull_request:
    branches: [tdcv2]
    paths:
      - "typescript/**"
      - "webdoc/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typescript-ci.yml"
  workflow_dispatch:

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=typescript

      - name: Lint
        run: npm run lint --workspace=typescript

      - name: Format check
        run: npm run format:check --workspace=typescript

      - name: Test
        run: npm run test:coverage --workspace=typescript

      - name: Build
        run: npm run build --workspace=typescript

      - name: Docs cover the engine
        if: matrix.node-version == '20.x'
        run: node webdoc/scripts/audit-doc-coverage.mjs

      - name: Docs examples are self-consistent
        if: matrix.node-version == '20.x'
        run: node webdoc/scripts/audit-example-consistency.mjs

      - name: Upload coverage artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: typescript/coverage/
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
