name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - "webdoc/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typescript-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - "webdoc/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typescript-ci.yml"
  workflow_dispatch:

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Room for a suite that keeps growing. The ceiling was 20, the job took
    # 16m08s in August, and the margin ran out — GitHub cancels rather than
    # fails, which reads as a broken build and is not one.
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ONE suite run per leg — the two legs divide the work rather than
      # repeating it.
      #
      # 20.x used to run the tests twice: once here with coverage, and again
      # inside `npm run check`, which contains its own `test` along with a
      # second typecheck, lint and format pass. That is what took the leg from
      # 16m08s in August to past the 20-minute ceiling, where GitHub cancels the
      # job. The 22.x leg, running the suite once, finished the same commit in
      # 7m45s — so the duplication was the whole difference.
      #
      # These four steps are what `check` opens with, so they belong to the leg
      # that does NOT run it. Coverage rides along here for the same reason: it
      # is one number about the suite, and measuring it twice measures nothing.
      - name: Typecheck
        if: matrix.node-version == '22.x'
        run: npm run typecheck --workspace=typescript

      - name: Lint
        if: matrix.node-version == '22.x'
        run: npm run lint --workspace=typescript

      - name: Format check
        if: matrix.node-version == '22.x'
        run: npm run format:check --workspace=typescript

      - name: Test
        if: matrix.node-version == '22.x'
        run: npm run test:coverage --workspace=typescript

      - name: Build
        run: npm run build --workspace=typescript

      # The whole gate, as one command, on one leg of the matrix.
      #
      # Written this way on purpose. CI used to name its checks one at a time,
      # and the list fell behind: of the fourteen steps in `npm run check`,
      # ELEVEN were absent here — every shared-fixture harness among them, so
      # the reference's agreement with the fixtures was verified by nobody
      # (five-ways.yml runs the four ports and not TypeScript). A doc example
      # could go stale, a diagnostic could move, an engine could disagree with
      # its own fixtures, and this file stayed green.
      #
      # `check` is the definition of the gate. Naming it rather than its
      # contents means a harness added later is in CI the day it is written.
      # It opens with lint, typecheck, format and the suite, which is why this
      # leg does not run those separately — see the note above them.
      - name: The whole gate (same command as local `npm run check`)
        if: matrix.node-version == '20.x'
        run: npm run check --workspace=typescript

      # The root `npm run check` has four steps the workspace one does not, and
      # two of them ran in no workflow at all. The other two do have a home:
      # `ports:build` is what five-ways.yml exists for, and `docs:check` runs in
      # docs.yml. These two had none, so a name the engine implements could lose
      # its last shared case, or a generated pack could drift from its source,
      # and every workflow stayed green. Together they take under a second.
      - name: Every engine name still has a shared case
        if: matrix.node-version == '20.x'
        run: npm run audit:fixtures

      - name: Generated packs still match their sources
        if: matrix.node-version == '20.x'
        run: npm run packs:generated

      - name: Docs cover the engine
        if: matrix.node-version == '20.x'
        run: node webdoc/scripts/audit-doc-coverage.mjs

      - name: Docs examples are self-consistent
        if: matrix.node-version == '20.x'
        run: node webdoc/scripts/audit-example-consistency.mjs

      # Coverage is measured on the 22.x leg, so the report is there to upload.
      - name: Upload coverage artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: typescript/coverage/
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
