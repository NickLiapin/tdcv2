name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - "webdoc/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typescript-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - "webdoc/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typescript-ci.yml"
  workflow_dispatch:

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=typescript

      - name: Lint
        run: npm run lint --workspace=typescript

      - name: Format check
        run: npm run format:check --workspace=typescript

      - name: Test
        run: npm run test:coverage --workspace=typescript

      - name: Build
        run: npm run build --workspace=typescript

      # The whole gate, as one command, on one leg of the matrix.
      #
      # Written this way on purpose. CI used to name its checks one at a time,
      # and the list fell behind: of the fourteen steps in `npm run check`,
      # ELEVEN were absent here — every shared-fixture harness among them, so
      # the reference's agreement with the fixtures was verified by nobody
      # (five-ways.yml runs the four ports and not TypeScript). A doc example
      # could go stale, a diagnostic could move, an engine could disagree with
      # its own fixtures, and this file stayed green.
      #
      # `check` is the definition of the gate. Naming it rather than its
      # contents means a harness added later is in CI the day it is written.
      # ~4 minutes locally; it repeats lint, typecheck and test, which is a
      # price worth paying for a list that cannot drift.
      - name: The whole gate (same command as local `npm run check`)
        if: matrix.node-version == '20.x'
        run: npm run check --workspace=typescript

      - name: Docs cover the engine
        if: matrix.node-version == '20.x'
        run: node webdoc/scripts/audit-doc-coverage.mjs

      - name: Docs examples are self-consistent
        if: matrix.node-version == '20.x'
        run: node webdoc/scripts/audit-example-consistency.mjs

      - name: Upload coverage artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: typescript/coverage/
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
