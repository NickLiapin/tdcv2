name: Coverage

# Every implementation reports its own coverage against its own floor.
#
# TypeScript had a ratchet from the scaffold and the four ports had none, which made the one
# number anybody quoted a statement about a fifth of the project. For a repository whose whole
# claim is that five implementations behave identically that is the wrong shape: a branch
# exercised in TypeScript and never reached in Java is not "Java's problem", it is a place
# where the two could already differ and nothing would say so.
#
# One job per language, as in `five-ways.yml`: the toolchains share nothing, and a slip should
# name the language in the check list without anyone opening a log.
#
# Separate from `five-ways.yml` because instrumentation is slow — Python's suite goes from 40
# seconds to six and a half minutes — and the suite gate should stay fast enough to block a
# merge on its own.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # At the ROOT, not `--prefix typescript`: this is an npm workspaces monorepo and the
      # lockfile lives at the top. `npm ci --prefix typescript` found no lockfile beside the
      # package it was pointed at and refused, so this job never ran once — the number it was
      # meant to guard was never measured in CI at all.
      - name: Install
        run: npm ci
      - name: Coverage
        run: node scripts/coverage.mjs --only typescript

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The parser is ANTLR output, generated rather than committed, and the generator runs
      # on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -e "python[dev]"
      - name: Generate the parser
        run: node scripts/generate-parsers.mjs
      - name: Coverage
        run: node scripts/coverage.mjs --only python

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Generate the parser
        run: node scripts/generate-parsers.mjs
      - name: Coverage
        run: node scripts/coverage.mjs --only rust

  java:
    name: Java
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Coverage
        run: node scripts/coverage.mjs --only java

  csharp:
    name: C#
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 6.0 is the one that matters: the projects target net6.0 and the runner ships none.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
      - name: Generate the parser
        run: node scripts/generate-parsers.mjs
      - name: Coverage
        run: node scripts/coverage.mjs --only csharp
