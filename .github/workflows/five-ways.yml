name: Five ways

# The five implementations are held to one contract by `fixtures/cross-language/`,
# but until this workflow only TypeScript was ever checked automatically. A port
# could sit broken for days: the fixtures said what the answer was, and nobody ran
# the four programs that had to produce it.
#
# One job per language rather than a matrix: the toolchains share nothing, and a
# failure should name the language in the check list without anyone opening a log.

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "rust/**"
      - "csharp/**"
      - "java/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "scripts/five-ways.mjs"
      - "scripts/generate-parsers.mjs"
      - ".github/workflows/five-ways.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "rust/**"
      - "csharp/**"
      - "java/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "scripts/five-ways.mjs"
      - "scripts/generate-parsers.mjs"
      - ".github/workflows/five-ways.yml"
  workflow_dispatch:
  # publish.yml runs this suite on the tagged commit before anything uploads.
  workflow_call:

# Only a pull request cancels its own older run. On main every commit keeps its verdict:
# cancelling there left a permanent "cancelled" mark on the superseded commit, which reads
# as a broken build (0.4.0, when the release mark replaced the commit before it). The group
# carries the commit so main's runs never queue behind or replace each other, and the ref so
# a run called by the publish workflow for a tag is its own group too.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('five-ways-{0}', github.ref) || format('five-ways-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The parser is ANTLR output, generated rather than committed, and the generator
      # runs on Node — `five-ways.mjs` invokes it before the suite.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -e "python[dev]"
      - name: Test
        run: node scripts/five-ways.mjs --only python

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        run: node scripts/five-ways.mjs --only rust

  csharp:
    name: C#
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # As with Python: the parser is generated, and the generator runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Both, and 6.0 is the one that matters: the projects target net6.0 — a
      # deliberate promise, since that is the oldest runtime still in support when a
      # consumer picks the package up — and the runner ships no .NET 6 at all. With
      # only the 7.0 SDK the build succeeded and the test host then refused to start,
      # which reads as a broken port and is nothing of the kind.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            7.0.x
      - name: Test
        run: node scripts/five-ways.mjs --only csharp

  java:
    name: Java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: node scripts/five-ways.mjs --only java
