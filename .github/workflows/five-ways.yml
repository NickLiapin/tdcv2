name: Five ways

# The five implementations are held to one contract by `fixtures/cross-language/`,
# but until this workflow only TypeScript was ever checked automatically. A port
# could sit broken for days: the fixtures said what the answer was, and nobody ran
# the four programs that had to produce it.
#
# One job per language rather than a matrix: the toolchains share nothing, and a
# failure should name the language in the check list without anyone opening a log.

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "rust/**"
      - "csharp/**"
      - "java/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "scripts/five-ways.mjs"
      - ".github/workflows/five-ways.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "rust/**"
      - "csharp/**"
      - "java/**"
      - "grammar/**"
      - "fixtures/**"
      - "data/**"
      - "scripts/five-ways.mjs"
      - ".github/workflows/five-ways.yml"
  workflow_dispatch:

concurrency:
  group: five-ways-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -e "python[dev]"
      - name: Test
        run: node scripts/five-ways.mjs --only python

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        run: node scripts/five-ways.mjs --only rust

  csharp:
    name: C#
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
      - name: Test
        run: node scripts/five-ways.mjs --only csharp

  java:
    name: Java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: node scripts/five-ways.mjs --only java
