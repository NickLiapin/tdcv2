name: Documentation

# Builds the three-language site from webdoc/ and publishes it to GitHub Pages.
#
# The site is built by the same command a developer runs locally
# (`npm --prefix webdoc run build`), so what goes online is what they saw. The
# checks run first: a page that links somewhere that does not exist, or a
# reference missing a row for a name the engine implements, should not reach
# the public site.

# The checks run on a PULL REQUEST too, and that is the point of the second
# trigger. They used to run only after a merge, so `docs:check` — the export
# drift guard, translation parity, the anchors, the reference rows — reported a
# broken doc when it was already on main and already being published. A PR
# builds and checks; only a push to main goes on to deploy.
on:
  push:
    branches: [main]
    paths:
      - "webdoc/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "webdoc/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# One deployment at a time; a newer commit supersedes an older one in flight,
# but never cancels a deployment that is already writing. A pull request is not
# a deployment, so it gets its own group per branch and a newer push to that
# branch cancels the older run — otherwise every PR would queue behind `pages`
# and behind each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      # Two installs on purpose: webdoc/ is NOT an npm workspace of the root — it
      # keeps its own lockfile so a Docusaurus upgrade cannot move the engine's
      # dependencies. `npm ci` at the root does not reach it.
      - name: Install
        run: |
          npm ci
          npm --prefix webdoc ci

      # The reference audit reads the engine's own tables, so the engine has to
      # exist before the docs can be judged against it.
      - name: Build the engine
        run: npm --workspace typescript run build

      - name: Check the docs before publishing them
        run: npm run docs:check

      - name: Build the site
        run: npm --prefix webdoc run build

      # Publishing steps only. A pull request stops after the build above, which
      # is where every check it could fail already ran.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: webdoc/build

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
