name: Publish all five

# One tag, five registries, one version.
#
# Before this file, npm, PyPI and crates.io were published by hand and Java and
# C# from CI. In a single afternoon the three manual ones failed three times —
# a wrong npm command, a broken local Python toolchain, and a crate that went to
# crates.io with no data packs in it, which had to be yanked. The two automated
# ones failed zero times, because their artefact checks run inside their own
# workflow rather than in somebody's memory.
#
# The versions also drifted, which is the other half of the problem: five
# separate publishes meant five chances to publish a different number. Here the
# tag names the version once, every job checks its own build file against it, and
# nothing is uploaded until all five artefacts have been built and RUN outside
# the repository.
#
#   git tag v0.1.7 && git push origin v0.1.7
#
# `workflow_dispatch` runs everything except the uploads, so the whole release
# can be proven without spending a version number that can never be reused.
# Every publishing step is guarded by the same `refs/tags/` condition.
#
# ── What has to exist on the registry side ───────────────────────────────────
# Nothing here stores a token. Four of the five registries hand this workflow a
# short-lived credential in exchange for GitHub's proof of which repository and
# which workflow file is asking, so the policy on each site names THIS file —
# renaming it breaks publishing, silently and only at the next release.
#
#   npm, PyPI, crates.io, NuGet — Trusted Publishing, configured on each site
#   Maven Central              — a GPG key and Portal credentials, in secrets
#
# Maven is the exception because Central asks for a signature over every
# artefact, which needs a private key rather than an identity token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Nothing publishes until this passes. It is the stage 0.1.5 did not get: the
  # sources were green and the crate was empty.
  gate:
    name: Versions agree, artefacts run outside the repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "6.0.x\n8.0.x" }
      - uses: dtolnay/rust-toolchain@stable

      - name: The tag must agree with every build file
        id: version
        run: |
          node scripts/verify-artefacts.mjs --only nothing
          declared=$(grep -m1 '"version"' typescript/package.json | sed 's/.*"version": "\(.*\)".*/\1/')
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$declared" != "$tagged" ]; then
              echo "tag $GITHUB_REF_NAME says $tagged, the build files say $declared" >&2
              exit 1
            fi
          fi
          echo "value=$declared" >> "$GITHUB_OUTPUT"
          echo "releasing $declared"

      - name: Generate the parsers a clean clone does not carry
        run: node scripts/generate-parsers.mjs --only csharp

      - name: Build the reference the artefact checks compare against
        run: |
          npm ci
          npm run build --workspace=typescript

      - name: Every artefact, built and run the way a stranger receives it
        run: node scripts/verify-artefacts.mjs

  # ───────────────────────────────────────────────────────────────────────────
  npm:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs a recent npm; the one bundled with Node 22 is
      # older than the feature.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build --workspace=typescript
      # `prepack` puts the starter packs inside the tarball. npm runs it itself,
      # which is why npm has never shipped an empty package — and why Cargo, which
      # has no such hook, once did.
      - name: Publish
        if: github.ref_type == 'tag'
        run: npm publish -w tdcv2 --access public

  pypi:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # A clean checkout carries neither the ANTLR parser nor the starter packs:
      # both are generated, and both are ignored by git. Without the first the
      # wheel cannot be imported at all; without the second `type="template"`
      # has nothing to draw from. 0.1.7, 0.2.0 and 0.2.1 shipped without either,
      # and `python/scripts/verify-wheel.mjs` now proves the whole recipe from a
      # clean clone before anything is uploaded.
      - name: Generate the parser a clean clone does not carry
        run: node scripts/generate-parsers.mjs --only python
      - name: Put the starter packs inside the wheel
        run: |
          python -m pip install --quiet 'antlr4-python3-runtime==4.13.2'
          cd python && python scripts/bundle_packs.py
      - name: Build the distributions
        run: |
          python -m pip install --quiet build
          cd python && python -m build
      - name: Publish
        if: github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  crates:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      # The step that 0.1.5 was missing. The starter packs live once at the
      # repository root and are copied in here, because a published crate has
      # nothing above it. `--allow-dirty` is not a shortcut: the copies are
      # deliberately uncommitted, and are removed again below.
      - name: Put the starter packs inside the crate
        run: cd rust && node scripts/bundle-packs.mjs add
      - name: Publish
        if: github.ref_type == 'tag'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Push
        if: github.ref_type == 'tag'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --manifest-path rust/Cargo.toml --allow-dirty
      - name: Take them out again
        if: always()
        run: cd rust && node scripts/bundle-packs.mjs remove

  maven:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build and sign the bundle
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          cd java
          ./gradlew publish
          # `maven-metadata.xml` is Central's to write, not ours to send: an
          # unexpected file in the bundle fails validation.
          cd build/central && find . -name 'maven-metadata.xml*' -delete
          zip -qr ../bundle.zip .
      - name: Every artefact must carry a signature
        # A missing signature is only reported after the upload, by which time the
        # deployment has to be dropped by hand.
        run: |
          cd java/build/central
          missing=0
          for f in $(find . -type f ! -name '*.asc' ! -name '*.md5' ! -name '*.sha*'); do
            [ -f "$f.asc" ] || { echo "no signature for $f" >&2; missing=1; }
          done
          exit $missing
      - name: Keep the bundle, so a failed upload can be inspected
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: java/build/bundle.zip
      # Central meters deployments per month, and the allowance can run out while
      # the other four registries are still free to take a release. The variable
      # lets a release skip Java without editing this file, and without touching
      # the four Trusted Publishing identities that are keyed to its NAME.
      #
      # Set `MAVEN_PUBLISH` to `off` in Settings -> Secrets and variables ->
      # Actions -> Variables to hold Java back; unset it, or set anything else,
      # to publish normally. The bundle above is still BUILT and SIGNED either
      # way, so the gate keeps proving the Java artefact runs — only the upload
      # is skipped, and the kept bundle can be sent by hand later. A held-back
      # version goes out afterwards with its own `java-v<version>` tag, which
      # `publish-maven.yml` answers.
      - name: Upload to the Central Portal
        if: github.ref_type == 'tag' && vars.MAVEN_PUBLISH != 'off'
        env:
          # The names the repository has actually held since the Java-only workflow: see
          # publish-maven.yml. When the five registries were merged into this file the secrets
          # were renamed in the CODE and nowhere else, so GitHub substituted two empty strings
          # and the Portal answered "Invalid token" — about an empty credential, which is true
          # and unhelpful. A missing secret is indistinguishable from a wrong one here.
          USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          # -w 0: GNU base64 wraps at 76 characters, and a newline inside an Authorization
          # header makes the whole credential invalid. macOS base64 does not wrap, so this
          # only ever bites on a runner.
          token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w 0)

          # The upload used to be read as an id whatever came back. When the Portal answered
          # `{"error":{"message":"Invalid token"}}` the script put that JSON in the status URL
          # and polled it twenty times, so the log said "Invalid token" in a place that looked
          # like a deployment id and the real problem — the credentials — was never named.
          # NO `name=`, deliberately, 2026-08-07. It is the label the Portal shows in its
          # deployment list, and it was added in 184fe9b6 so that ten releases would not
          # all read "bundle.zip". It is being given up because Central's monthly release
          # limit is worth more than a readable list: Nick watched the counter rise
          # promptly after every upload up to 0.1.6, then watched 0.1.7 — the one release
          # sent without `name=` — leave it unmoved, still unmoved a day later.
          #
          # Said plainly because it will look like an oversight to whoever reads this
          # next: the numbers visible from outside fit that reading and the opposite one
          # equally (both give the 290 files the Usage Center reports, because the first
          # release carries 50 files where the rest carry 60), so this rests on watching
          # the counter rather than on anything provable from here. If a release ever does
          # move the count while unnamed, this comment is wrong and `name=` should come
          # back — the list is genuinely better with it.
          #
          # No publishingType either: the default publishes on its own, where USER_MANAGED
          # would leave a validated bundle waiting for a click nobody is watching for.
          code=$(curl -sS -o /tmp/upload.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -F bundle=@java/build/bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload")
          id=$(cat /tmp/upload.out)
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "the Portal refused the upload (HTTP $code): $id" >&2
            case "$id" in
              *"Invalid token"*)
                echo "" >&2
                echo "CENTRAL_TOKEN_USERNAME and CENTRAL_TOKEN_PASSWORD must be the two halves" >&2
                echo "of a Central USER TOKEN — not the site login. Generate one at" >&2
                echo "central.sonatype.com -> View Account -> Generate User Token; the password" >&2
                echo "half is shown once, so a lost one has to be regenerated." >&2 ;;
            esac
            exit 1
          fi
          echo "deployment $id"
          for _ in $(seq 1 20); do
            state=$(curl -sS -X POST -H "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id" \
              | sed -n 's/.*"deploymentState":"\([A-Z]*\)".*/\1/p')
            echo "  $state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED)
                echo "bundle accepted — https://central.sonatype.com/publishing/deployments"
                exit 0 ;;
              FAILED)
                echo "the Portal rejected the bundle; reasons are on the deployment page" >&2
                exit 1 ;;
            esac
            sleep 30
          done
          echo "still not validated after ten minutes" >&2
          exit 1

  nuget:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "6.0.x\n8.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate the parser
        # `csharp/Tdcv2/Generated/` is produced from the shared grammar, so a
        # clean clone has to make it before anything compiles.
        run: node scripts/generate-parsers.mjs --only csharp
      - name: Pack both packages
        run: |
          cd csharp
          node scripts/bundle-packs.mjs add
          dotnet pack Tdcv2/Tdcv2.csproj -c Release --nologo
          dotnet pack Tdcv2.Cli.Tool/Tdcv2.Cli.Tool.csproj -c Release --nologo
          node scripts/bundle-packs.mjs remove
      - name: Publish
        if: github.ref_type == 'tag'
        uses: NuGet/login@v1
        id: login
        with:
          user: NickLiapin
      - name: Push
        if: github.ref_type == 'tag'
        run: |
          for dir in csharp/Tdcv2 csharp/Tdcv2.Cli.Tool; do
            dotnet nuget push "$dir/bin/Release/*.nupkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
