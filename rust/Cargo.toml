[package]
name = "tdcv2"
version = "0.1.5"
edition = "2021"
rust-version = "1.74"
description = "TDC — The Data Constructor. Deterministic test data from a declarative config."
license = "MIT"
repository = "https://github.com/NickLiapin/tdcv2"
keywords = ["test-data", "synthetic-data", "data-generation", "deterministic"]
categories = ["development-tools::testing"]
readme = "README.md"

# What goes in the published crate.
#
# Spelled out because the starter data packs under `src/packs/bundled/` are
# gitignored — they are a temporary copy of `data/packs`, which lives once at the
# repository root — and Cargo excludes gitignored files unless an `include` list
# overrides that. Without them the crate builds and then answers every
# `type="template"` with "no data packs found", because a crate in
# ~/.cargo/registry has no repository above it to walk up to. Checked by
# `scripts/verify-crate.mjs`, which packages, unpacks OUTSIDE the repository,
# builds and runs.
include = [
    "src/**/*.rs",
    "src/packs/bundled/**/*.txt",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

# No dependencies, and that is deliberate rather than austere. The three other
# implementations produce identical bytes because every number, every rounding
# and every compressed block is written here rather than borrowed: a crate that
# changed its rounding, its hashing or its deflate level would change our
# output. The parser is hand-written for the same reason plus one more — the
# only ANTLR runtime for Rust targets 4.8 and the shared grammar is 4.13.

[lib]
name = "tdcv2"
path = "src/lib.rs"

[[bin]]
name = "tdcv2"
path = "src/bin/tdcv2.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
